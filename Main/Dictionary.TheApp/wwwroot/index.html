<!DOCTYPE html>

<!--
Do not move this to Shared, although it could be reused by a WebAssembly project.
There's no way how to properly reference it from Shared.
Each project must have this file among its wwwroot files, even when the content is identical.
-->

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Dictionary</title>
        <base href="/" />
        <link rel="stylesheet" href="_content/Dictionary.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="_content/Dictionary.Shared/app.css" />
        <link rel="stylesheet" href="Dictionary.TheApp.styles.css" />
        <link rel="icon" href="data:,">
    </head>

    <body>
        <div id="app">
            <div class="min-vh-100 d-flex align-items-center justify-content-center">
                <h3 class="fw-bold">
                    <!-- Do not use an HTML entity for three dots. It's slightly higher than letters and looks awful. -->
                    <span id="loading">Loading</span>...
                </h3>
                <!-- Do not use a spinner here, it's laggy on Android. -->
            </div>
        </div>

        <script src="js/indexTranslations.js"></script>
        <script src="_framework/blazor.webview.js" autostart="false"></script>
    </body>
</html>
